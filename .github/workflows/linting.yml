name: Linting (Python, Terraform)

on:
#  workflow_call:
  workflow_dispatch:
    inputs:
      aws_account_id:
        description: AWS Account Id
        type: string
      aws_region:
        description: Target AWS Region
        type: string
        default: "us-east-1"
      ecr_repo_name:
        description: Name of ECR Repo in AWS
        type: string
        default: "cst_base"
      image_tag:
        description: Tag to apply to images
        type: string
        default: "cst_base"

jobs:
  login-ecr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ inputs.aws_account_id }}
          mask-password: 'false'
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
      docker_username: ${{ steps.login-ecr.outputs.docker_username_123456789012_dkr_ecr_us_east_1_amazonaws_com }}
      docker_password: ${{ steps.login-ecr.outputs.docker_password_123456789012_dkr_ecr_us_east_1_amazonaws_com }}
  linter:
    runs-on: ubuntu-latest
    container:
      image: "${{ inputs.aws_account_id }}.dkr.ecr.${{ inputs.aws_region }}.amazonaws.com/${{ inputs.ecr_repo_name }}:${{ inputs.image_tag }}"
      credentials:
        username: ${{ needs.login-to-amazon-ecr.outputs.docker_username }}
        password: ${{ needs.login-to-amazon-ecr.outputs.docker_password }}
    steps:
      - uses: actions/checkout@v4
      - name: Terraform Format
        working-directory: ./terraform/aws
        run: terraform fmt -check -recursive
      - name: Terraform Validate
        working-directory: ./terraform/aws
        run: terraform validate -no-color
      - name: Python Lint
        working-directory: .cicd/bash/linters
        run: sh python-lint.sh
      - name: Python Formatting
        working-directory: .cicd/bash/linters
        run: sh python-format.sh
