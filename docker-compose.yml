services:
  cst-base:
    container_name: cst-base-container
    image: cst-base:latest
    platform: linux/amd64
    # image: ghcr.io/aconn1994/cst_base:main
    build:
      dockerfile: local_env/images/base_image/Dockerfile
      context: .
    privileged: true
    user: root
    working_dir: /root/cloud-server-tool
    volumes:
      - .:/root/cloud-server-tool:rw,z
    entrypoint: /bin/bash

  cst-debug:
    container_name: cst-debug-container
    image: cst_debug:latest
    platform: linux/amd64
    build:
      dockerfile: local_env/images/debug_image/Dockerfile
      context: .
    privileged: true
    user: root
    working_dir: /root/cloud-server-tool
    volumes:
      - .:/root/cloud-server-tool:rw,z
    ports:
      - "2223:22"
    depends_on:
      - cst-base

  game-test-linux:
    container_name: game-test-linux-container
    platform: linux/amd64
    build:
      dockerfile: .cicd/game-images/linux/Dockerfile
      context: .
    privileged: true
    user: root
    working_dir: /root/gameuser
    volumes:
      - .:/root/gameuser:rw,z
    entrypoint: /bin/bash